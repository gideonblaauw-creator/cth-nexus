const EPIC_SLUG_LEGACY={
  'o3-smart-cities':'O3 SMART CITIES','green-leaf':'GREEN LEAF','bio-natural-solutions':'BIO NATURAL SOLUTIONS',
  'basilisco':'BASÍLISCO','reemade':'REEMADE','xiclo':'XICLO','ecopoop':'ECO POOP',
  'seos-energy':'SEOS ENERGY SAS BIC','bioambientar':'BIOAMBIENTAR','biogar':'BIOGAR','gescol':'GESCOL SAS BIC'
};
let epicOnly=new URLSearchParams(location.search).get('epic')==='1';
let imdOnly=new URLSearchParams(location.search).get('imd_pe')==='1';
if(epicOnly&&imdOnly){imdOnly=false;}
let EPIC_CARDS=[];
let IMD_CARDS=[];

function normalizeProgram(p){
  if(!p) return 'CLP';
  if(p==='CLP26') return 'CLP';
  if(p==='GIZ Growth Services') return 'CLP';
  if(p==='CLAC23'||p==='CLAC22'||p==='CLAC24'||p==='CLAC25'||p==='CLAC21'||p==='CLP'||p==='CLP20'||p==='CLP25') return p;
  return 'CLP';
}
function normalizeStage(st){
  if(!st||st==='[PENDIENTE]'||st==='Launched') return st==='Launched'?'Seed':(st||'Seed');
  if(st==='Private Beta') return 'Pre-Seed';
  if(st==='Public Beta') return 'Pre-Series A';
  return st;
}
function legacyForSlug(slug,name){
  const key=EPIC_SLUG_LEGACY[slug];
  if(key) return S.find(s=>s.n===key);
  return S.find(s=>s.n.toUpperCase()===String(name||'').toUpperCase());
}
function epicToCard(e){
  const legacy=legacyForSlug(e.slug,e.name);
  const desc=e.desc_en||legacy?.d||(`${e.name} — CleantechHUB portfolio startup.`);
  const descEs=e.desc_es||legacy?.ds||desc;
  return {
    slug:e.slug,n:e.name,p:e.program?normalizeProgram(e.program):'',c:e.country||'CO',w:e.website,
    t:e.theme||legacy?.t||'',st:normalizeStage(e.stage)||legacy?.st||'Seed',
    d:desc,ds:descEs,ct1:e.ct1||legacy?.ct1||'',ct2:legacy?.ct2||'',founder:e.founder,epic:true
  };
}
function imdToCard(e){
  const desc=e.desc_en||(`${e.name} — Peru CTH program alumni.`);
  const descEs=e.desc_es||desc;
  return {
    slug:e.slug,n:e.name,p:normalizeProgram(e.program),c:e.country||'PE',w:e.website,
    t:e.theme||'BIO',st:normalizeStage(e.stage)||'Seed',
    d:desc,ds:descEs,ct1:e.ct1||'',ct2:'',founder:e.founder,imd:true,
    nexusPath:e.nexus_path||''
  };
}
async function loadEpicCards(){
  try{
    const res=await fetch('/nexus-assets/epic-angels-shareable.json?v=20261013-clp26');
    const data=await res.json();
    EPIC_CARDS=(data.startups||[]).map(epicToCard);
  }catch(err){console.error('Epic list load failed',err);EPIC_CARDS=[];}
  if(epicOnly){
    document.getElementById('epic-tog')?.classList.add('active');
    document.getElementById('epic-stat')?.style.setProperty('display','inline-block');
    webOnly=false;
    document.getElementById('web-tog')?.classList.remove('active');
  }
  render();
}
async function loadImdCards(){
  try{
    const res=await fetch('/nexus-assets/imd-peru-shareable.json?v=20260924-imd16');
    const data=await res.json();
    IMD_CARDS=(data.startups||[]).map(imdToCard);
  }catch(err){console.error('IMD Peru list load failed',err);IMD_CARDS=[];}
  if(imdOnly){
    document.getElementById('imd-tog')?.classList.add('active');
    document.getElementById('imd-stat')?.style.setProperty('display','inline-block');
    webOnly=false;
    document.getElementById('web-tog')?.classList.remove('active');
  }
  render();
}
function syncSpecialQuery(){
  const next=new URLSearchParams(location.search);
  if(epicOnly){next.set('epic','1');next.delete('imd_pe');imdOnly=false;}
  else next.delete('epic');
  if(imdOnly){next.set('imd_pe','1');next.delete('epic');epicOnly=false;}
  else next.delete('imd_pe');
  const qs=next.toString();
  history.replaceState(null,'',location.pathname+(qs?('?'+qs):''));
}
function toggleEpic(){
  epicOnly=!epicOnly;
  if(epicOnly) imdOnly=false;
  syncSpecialQuery();
  document.getElementById('epic-tog')?.classList.toggle('active',epicOnly);
  document.getElementById('epic-stat')?.style.setProperty('display',epicOnly?'inline-block':'none');
  document.getElementById('imd-tog')?.classList.toggle('active',imdOnly);
  document.getElementById('imd-stat')?.style.setProperty('display',imdOnly?'inline-block':'none');
  if(epicOnly){webOnly=false;document.getElementById('web-tog')?.classList.remove('active');}
  render();
}
function toggleImd(){
  imdOnly=!imdOnly;
  if(imdOnly) epicOnly=false;
  syncSpecialQuery();
  document.getElementById('imd-tog')?.classList.toggle('active',imdOnly);
  document.getElementById('imd-stat')?.style.setProperty('display',imdOnly?'inline-block':'none');
  document.getElementById('epic-tog')?.classList.toggle('active',epicOnly);
  document.getElementById('epic-stat')?.style.setProperty('display',epicOnly?'inline-block':'none');
  if(imdOnly){webOnly=false;document.getElementById('web-tog')?.classList.remove('active');}
  render();
}

  document.getElementById('fb-bio').textContent=t.bio;
  document.getElementById('fb-en').textContent=t.en;
  document.getElementById('fb-psa').textContent=t.psa;
  document.getElementById('fb-sa').textContent=t.sa;
  document.getElementById('fb-sb').textContent=t.sb;
  document.getElementById('lbl-total').textContent='Total';
}

function setF(dim,val){
  if(dim==='prog'){fProg=val;document.querySelectorAll('[data-p]').forEach(b=>b.classList.toggle('active',b.dataset.p===val));}
  if(dim==='theme'){fTheme=val;document.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('active',b.dataset.t===val));}
  if(dim==='stage'){fStage=val;document.querySelectorAll('[data-s]').forEach(b=>b.classList.toggle('active',b.dataset.s===val));}
  render();
}

function renderCard(s,t){
  const flag=FLAGS[s.c]||'\u{1F30D}';
  const hasW=!!s.w;
  const desc=lang==='ES'?s.ds:s.d;
  const webBtn=hasW
    ?'<a class="site-btn" href="https://'+s.w+'" target="_blank" rel="noopener" onclick="event.stopPropagation()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg> '+t.visit+'</a>'
    :'';
  const nexusHref=s.nexusPath||(s.slug?'/s/'+s.slug:'');
  const nexusBtn=nexusHref?'<a class="nexus-btn" href="'+nexusHref+'" onclick="event.stopPropagation()">Nexus ↗</a>':'';
  const onePagerBtn=s.slug?'<a class="onepager-btn" href="/s/'+s.slug+'" onclick="event.stopPropagation()">'+t.onePager+'</a>':'';
  const epicBadge=s.epic?'<span class="epic-badge">Epic Angels</span>':'';
  const imdBadge=s.imd?'<span class="imd-badge">IMD · Perú</span>':'';
  const stk={'Pre-Seed':'PS','Seed':'S','Pre-Series A':'PSA','Series A':'SA','Series B+':'SBP','regional':'REG','semi':'SEM','national':'NAT'}[s.st]||'PS';
  const progBadge=s.p?'<span class="badge bp-'+s.p+'">'+s.p+'</span>':'';
  const themeBadge=s.t?'<span class="badge bt-'+s.t+'">'+((t.tShort&&t.tShort[s.t])||s.t)+'</span>':'';
  const stageLabel=(t.sShort&&t.sShort[s.st])||s.st;
  const ctBadges=(s.ct1?ctBadge(s.ct1):'')+(s.ct2?ctBadge(s.ct2):'');
  const barHtml=s.p?'<div class="cb bar-'+s.p+'"></div>':'<div class="cb bar-none"></div>';
  const modalData=encodeURIComponent(JSON.stringify({n:s.n,p:s.p||'',c:FLAGS[s.c]||'\u{1F30D}',w:s.w||'',th:s.t||'',st:s.st,d:lang==='ES'?s.ds:s.d,ct1:s.ct1||'',ct2:s.ct2||'',slug:s.slug||''}));
  const actions=(nexusBtn||webBtn||onePagerBtn)?'<div class="cbot-actions">'+nexusBtn+webBtn+onePagerBtn+'</div>':'';
  return '<div class="card '+(hasW?'':'nw')+'" data-startup="'+modalData+'" onclick="openCTModal(this)">'+barHtml+'<div class="ct"><div class="cn">'+s.n+'</div><div class="cf">'+flag+'</div></div><div class="cd">'+desc+'</div><div class="cbot">'+epicBadge+imdBadge+progBadge+themeBadge+'<span class="badge bs-'+stk+'">'+stageLabel+'</span>'+ctBadges+actions+'</div></div>';
}

function toggleWeb(){webOnly=!webOnly;document.getElementById('web-tog').classList.toggle('active',webOnly);render();}

function render(){
  const t=UI[lang];
  const q=document.getElementById('q').value.trim().toLowerCase();
  if(epicOnly){
    let list=EPIC_CARDS.slice();
    if(q) list=list.filter(s=>s.n.toLowerCase().includes(q)||(s.founder||'').toLowerCase().includes(q));
    document.getElementById('st-total').textContent=EPIC_CARDS.length||21;
    document.getElementById('st-web').textContent=EPIC_CARDS.filter(s=>s.w).length;
    document.getElementById('st-show').textContent=list.length;
    document.getElementById('ri').textContent=list.length?(`${list.length}/${EPIC_CARDS.length||21} Epic Angels · verified site`):'';
    const grid=document.getElementById('grid');
    if(!list.length){grid.innerHTML='<div class="empty">'+t.noMatch+'</div>';return;}
    grid.innerHTML=list.map(s=>renderCard(s,t)).join('');
    return;
  }
  if(imdOnly){
    let list=IMD_CARDS.slice();
    if(q) list=list.filter(s=>s.n.toLowerCase().includes(q)||(s.founder||'').toLowerCase().includes(q));
    const total=IMD_CARDS.length||16;
    document.getElementById('st-total').textContent=total;
    document.getElementById('st-web').textContent=list.filter(s=>s.w).length;
    document.getElementById('st-show').textContent=list.length;
    document.getElementById('ri').textContent=list.length?(`${list.length}/${total} IMD · Perú · CTH programs`):'';
    const grid=document.getElementById('grid');
    if(!list.length){grid.innerHTML='<div class="empty">'+t.noMatch+'</div>';return;}
    grid.innerHTML=list.map(s=>renderCard(s,t)).join('');
    return;
  }
  let list=S;
  if(fProg!=='ALL') list=list.filter(s=>s.p===fProg);
  if(fTheme!=='ALL') list=list.filter(s=>s.t===fTheme);
  if(fStage!=='ALL') list=list.filter(s=>s.st===fStage);
  if(webOnly) list=list.filter(s=>s.w);
  if(q) list=list.filter(s=>s.n.toLowerCase().includes(q));
  list=[...list].sort((a,b)=>{if(!!a.w===!!b.w)return a.n.localeCompare(b.n);return a.w?-1:1;});

  document.getElementById('st-total').textContent=S.length;
  document.getElementById('st-web').textContent=S.filter(s=>s.w).length;
  document.getElementById('st-show').textContent=list.length;
  document.getElementById('ri').textContent=list.length?t.shown(list.length):'';

  const grid=document.getElementById('grid');
  if(!list.length){grid.innerHTML='<div class="empty">'+t.noMatch+'</div>';return;}

  grid.innerHTML=list.map(s=>renderCard(s,t)).join('');
}

applyUI();loadEpicCards();loadImdCards();
</script>
