<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>D5 · Story explorer</title>
  <link rel="stylesheet" href="../shared/common.css" />
  <style>
    .layout { display: grid; grid-template-columns: 280px 1fr; height: calc(100vh - 118px); min-height: 520px; }
    .story { border-right: 1px solid var(--border); background: #fff; padding: 12px; overflow: auto; }
    .step { border: 1px solid var(--border); border-radius: 10px; padding: 10px; margin-bottom: 8px; cursor: pointer; font-size: 11px; }
    .step.on { border-color: var(--accent); background: #f0f7ff; }
    .step h3 { margin: 0 0 4px; font-size: 12px; color: var(--head); }
    #graph { background: #eef6fb; width: 100%; height: 100%; min-height: 480px; position: relative; }
    #graph svg { width: 100%; height: 100%; }
    input[type=range] { width: 100%; margin-top: 8px; }
  </style>
</head>
<body data-brand="rein">
  <header>
    <div class="badge-dir">Direction 5</div>
    <h1>Story-driven explorer — REIN program narrative</h1>
    <p>Guided chapters + time slider (cohort proxy) · highlights subgraph per story beat</p>
  </header>
  <div class="toolbar">
    <span id="chapter-label" style="font-weight:700;color:var(--head)"></span>
    <span id="stat" style="color:var(--muted)"></span>
  </div>
  <div class="layout">
    <div class="story" id="steps"></div>
    <div id="graph"><svg id="graph-svg" viewBox="-160 -160 320 320"></svg></div>
  </div>
  <script>
(async function () {
  const [actors, relations] = await Promise.all([
    fetch('../shared/actors-geo.json').then(r => r.json()),
    fetch('../shared/relations.json').then(r => r.json()),
  ]);
  const CAT = { startup:'#e87722', accelerator:'#669348', funder:'#0c498a', government:'#6b4c9a', academia:'#2a9d8f', corporate:'#457b9d', international:'#f4a261', finance:'#264653', ngo_foundation:'#e76f51', chamber:'#8d99ae', media:'#bc6c25', default:'#5a7088' };

  const chapters = [
    { id: 'challenges', title: '1 · Retos climáticos', blurb: 'Organizaciones vinculadas a desafíos (works_on_challenge).', types: new Set(['works_on_challenge']) },
    { id: 'policy', title: '2 · Política & regulación', blurb: 'Capas gubernamentales y regulación.', types: new Set(['regulates_layer', 'runs_program', 'oversees']) },
    { id: 'capital', title: '3 · Capital & cofinanciamiento', blurb: 'Flujos cofunds / funds_layer hacia hubs.', types: new Set(['cofunds', 'funds_layer']) },
    { id: 'hubs', title: '4 · Hubs & incubación', blurb: 'Universidades → incubadoras → startups.', types: new Set(['hosts', 'incubated', 'accelerated']) },
    { id: 'network', title: '5 · Alianzas', blurb: 'Partnerships y redes transversales.', types: new Set(['partner', 'part_of_group', 'part_of_network', 'participates']) },
  ];

  const pos = new Map();
  actors.forEach((a, i) => {
    pos.set(a.id, { x: Math.cos(i / actors.length * 6.28) * 110, y: Math.sin(i / actors.length * 6.28) * 110 });
  });
  const svg = document.getElementById('graph-svg');

  function applyChapter(ch) {
    const activeRels = relations.filter(r => ch.types.has(r.type));
    const activeNodes = new Set();
    activeRels.forEach(r => { activeNodes.add(r.source); activeNodes.add(r.target); });
    svg.innerHTML = '';
    activeRels.forEach(r => {
      const s = pos.get(r.source), t = pos.get(r.target);
      if (!s || !t) return;
      svg.insertAdjacentHTML('beforeend', `<line x1="${s.x}" y1="${s.y}" x2="${t.x}" y2="${t.y}" stroke="#0c498a" stroke-width="1.2" opacity="0.55"/>`);
    });
    activeNodes.forEach(id => {
      const p = pos.get(id);
      const a = actors.find(x => x.id === id);
      const col = CAT[a?.category] || '#e87722';
      svg.insertAdjacentHTML('beforeend', `<circle cx="${p.x}" cy="${p.y}" r="7" fill="${col}" stroke="#fff" stroke-width="1"/>`);
    });
    document.getElementById('chapter-label').textContent = ch.title;
    document.getElementById('stat').textContent = `${activeRels.length} relaciones · ${activeNodes.size} actores destacados`;
  }

  const stepsEl = document.getElementById('steps');
  chapters.forEach((ch, idx) => {
    const div = document.createElement('div');
    div.className = 'step' + (idx === 0 ? ' on' : '');
    div.innerHTML = `<h3>${ch.title}</h3><p>${ch.blurb}</p>`;
    div.addEventListener('click', () => {
      stepsEl.querySelectorAll('.step').forEach(s => s.classList.remove('on'));
      div.classList.add('on');
      applyChapter(ch);
    });
    stepsEl.appendChild(div);
  });
  const slider = document.createElement('input');
  slider.type = 'range';
  slider.min = 0;
  slider.max = chapters.length - 1;
  slider.value = 0;
  slider.addEventListener('input', () => {
    const i = parseInt(slider.value, 10);
    stepsEl.querySelectorAll('.step').forEach((s, j) => s.classList.toggle('on', j === i));
    applyChapter(chapters[i]);
  });
  stepsEl.appendChild(slider);
  applyChapter(chapters[0]);
})();
  </script>
</body>
</html>
