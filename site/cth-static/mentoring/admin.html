<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CLP26 Mentor Approval — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&family=Titillium+Web:wght@700&display=swap" rel="stylesheet">
<style>
  :root { --blue: #0C498A; --light: #B2EEFA; --green: #9DC384; --dark-green: #669348; --sky: #69B5FA; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Open Sans', sans-serif; background: #f4f7fa; color: #1a1a2e; min-height: 100vh; }
  .top-bar { background: var(--blue); color: white; padding: 16px 32px; display: flex; align-items: center; gap: 16px; }
  .top-bar h1 { font-family: 'Titillium Web', sans-serif; font-size: 20px; }
  .top-bar .badge { background: var(--sky); color: var(--blue); font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 12px; }

  #auth-gate { max-width: 400px; margin: 80px auto; text-align: center; }
  #auth-gate input { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 15px; margin: 16px 0; }
  #auth-gate button { background: var(--blue); color: white; border: none; padding: 12px 32px; border-radius: 8px; font-size: 15px; cursor: pointer; }
  #auth-gate button:hover { background: #083a6e; }
  #auth-error { color: #cc0000; font-size: 14px; margin-top: 8px; display: none; }

  #admin-panel { display: none; max-width: 900px; margin: 32px auto; padding: 0 16px; }
  .mentor-row { background: white; border-radius: 10px; padding: 20px 24px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .mentor-row h3 { font-size: 17px; color: var(--blue); margin-bottom: 4px; }
  .mentor-row .meta { font-size: 13px; color: #666; margin-bottom: 8px; }
  .mentor-row .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .mentor-row .tag { font-size: 12px; padding: 3px 10px; border-radius: 12px; background: var(--light); color: var(--blue); font-weight: 600; }
  .mentor-row .actions { display: flex; gap: 10px; }
  .btn-approve { background: var(--dark-green); color: white; border: none; padding: 8px 20px; border-radius: 6px; font-size: 14px; cursor: pointer; font-weight: 600; }
  .btn-approve:hover { background: #557a38; }
  .btn-reject { background: #cc4444; color: white; border: none; padding: 8px 20px; border-radius: 6px; font-size: 14px; cursor: pointer; font-weight: 600; }
  .btn-reject:hover { background: #aa2222; }
  .btn-approve:disabled, .btn-reject:disabled { opacity: .5; cursor: not-allowed; }
  .status-msg { font-size: 13px; font-weight: 600; margin-left: 12px; }
  .status-msg.ok { color: var(--dark-green); }
  .status-msg.no { color: #cc4444; }

  .empty { text-align: center; color: #888; padding: 48px; font-size: 15px; }
  .refresh-btn { background: var(--sky); color: var(--blue); border: none; padding: 8px 20px; border-radius: 6px; font-size: 14px; cursor: pointer; font-weight: 600; margin-bottom: 20px; }
</style>
</head>
<body>

<div class="top-bar">
  <h1>CLP26 Mentor Approval</h1>
  <span class="badge">Admin</span>
</div>

<div id="auth-gate">
  <h2 style="margin-bottom:8px;">Admin Access</h2>
  <p style="color:#666;font-size:14px;">Enter the admin key to manage mentor registrations.</p>
  <input type="password" id="key-input" placeholder="CTH_ADMIN_KEY">
  <br>
  <button onclick="authenticate()">Enter</button>
  <div id="auth-error">Invalid key or connection error.</div>
</div>

<div id="admin-panel">
  <button class="refresh-btn" onclick="loadPending()">Refresh</button>
  <div id="pending-list"></div>
</div>

<script>
const API = '/mentoring/api/admin';
let adminKey = '';

async function authenticate() {
  adminKey = document.getElementById('key-input').value.trim();
  if (!adminKey) return;
  try {
    const resp = await fetch(`${API}/pending`, { headers: { 'X-CTH-Admin-Key': adminKey } });
    if (resp.status === 401) {
      document.getElementById('auth-error').style.display = 'block';
      return;
    }
    document.getElementById('auth-gate').style.display = 'none';
    document.getElementById('admin-panel').style.display = 'block';
    const data = await resp.json();
    renderPending(data);
  } catch (e) {
    document.getElementById('auth-error').textContent = 'Connection error: ' + e.message;
    document.getElementById('auth-error').style.display = 'block';
  }
}

async function loadPending() {
  const resp = await fetch(`${API}/pending`, { headers: { 'X-CTH-Admin-Key': adminKey } });
  const data = await resp.json();
  renderPending(data);
}

function parseModules(comment) {
  if (!comment) return [];
  const match = comment.match(/Modules:\s*([\d,\s]+)/);
  if (!match) return [];
  return match[1].split(',').map(s => s.trim()).filter(Boolean);
}

function renderPending(mentors) {
  const el = document.getElementById('pending-list');
  if (!mentors.length) {
    el.innerHTML = '<div class="empty">No pending mentor registrations.</div>';
    return;
  }
  el.innerHTML = mentors.map(m => {
    const modules = parseModules(m.comment);
    const tags = modules.map(n => `<span class="tag">M${n}</span>`).join('');
    return `
      <div class="mentor-row" id="row-${m.id}">
        <h3>${m.name || 'N/A'}</h3>
        <div class="meta">${m.email || ''} · ${m.company_name || ''} · ${m.function || ''}</div>
        <div class="meta">Phone: ${m.phone || m.mobile || 'N/A'} · Registered: ${(m.create_date || '').split(' ')[0]}</div>
        <div class="tags">${tags}</div>
        <div class="actions">
          <button class="btn-approve" onclick="decide(${m.id},'approve',this)">Approve</button>
          <button class="btn-reject" onclick="decide(${m.id},'reject',this)">Reject</button>
        </div>
      </div>`;
  }).join('');
}

async function decide(partnerId, action, btn) {
  const row = document.getElementById('row-' + partnerId);
  const buttons = row.querySelectorAll('button');
  buttons.forEach(b => b.disabled = true);

  try {
    const resp = await fetch(`${API}/${action}/${partnerId}`, {
      method: 'POST',
      headers: { 'X-CTH-Admin-Key': adminKey },
    });
    const result = await resp.json();
    const msg = document.createElement('span');
    msg.className = 'status-msg ' + (action === 'approve' ? 'ok' : 'no');
    msg.textContent = action === 'approve' ? 'Approved' : 'Rejected';
    row.querySelector('.actions').appendChild(msg);
  } catch (e) {
    buttons.forEach(b => b.disabled = false);
    alert('Error: ' + e.message);
  }
}

document.getElementById('key-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') authenticate();
});
</script>
</body>
</html>
